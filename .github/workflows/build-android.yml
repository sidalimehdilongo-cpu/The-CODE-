name: Build Android (APK de test + AAB Play Store)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Identifiant unique de l'application (ex. com.monnom.coderoute)"
        required: true
        default: "com.yourname.coderoute"
      app_label:
        description: "Nom affiché sous l'icône"
        required: true
        default: "Code de la route"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet et vérifier son contenu
        run: |
          ZIP="$(ls *.zip 2>/dev/null | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier .zip à la racine du dépôt."
            exit 1
          fi
          echo "Archive utilisée : $ZIP"
          unzip -q -o "$ZIP"
          cp -r code_route_fr/. .
          echo "Images : $(ls assets/images | wc -l) (attendu : 87)"
          echo "Banques de questions :"
          ls assets/questions
          echo "Achat simulé présent dans main.dart : $(grep -c FAKE_PURCHASE lib/main.dart) (attendu : 2 ou plus)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Android
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_LABEL: ${{ inputs.app_label }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -euo pipefail
          [ -n "${ADMOB_APP_ID:-}" ] || ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"
          export ADMOB_APP_ID
          ORG="${APP_ID%.*}"
          NAME="${APP_ID##*.}"
          echo "Identifiant de l'application : $APP_ID"
          TMP="$(mktemp -d)"
          flutter create --org "$ORG" --project-name "$NAME" --platforms=android "$TMP/app" > /dev/null
          rm -rf android
          cp -r "$TMP/app/android" android
          python3 - <<'PY'
          import os, re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          label = os.environ["APP_LABEL"]
          admob = os.environ["ADMOB_APP_ID"]
          s = re.sub(r'android:label="[^"]*"', lambda m: 'android:label="' + label + '"', s, count=1)
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              m = re.search(r"<application[^>]*>", s)
              meta = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="' + admob + '"/>'
              s = s[:m.end()] + meta + s[m.end():]
          open(p, "w", encoding="utf-8").write(s)
          PY
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$f" || true
          done
          echo "Projet Android prêt."

      - name: Dépendances
        run: flutter pub get

      - name: APK de test
        run: flutter build apk --release --dart-define=FAKE_PURCHASE=true --dart-define=ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID"

      - name: AAB pour le Play Store
        run: flutter build appbundle --release --dart-define=ADMOB_INTERSTITIAL_ID="$ADMOB_INTERSTITIAL_ID"

      - name: Signer l'AAB avec votre clé d'envoi
        if: env.HAS_KEYSTORE == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          IN=build/app/outputs/bundle/release/app-release.aab
          OUT=build/app/outputs/bundle/release/app-release-signed.aab
          cp "$IN" "$OUT"
          zip -q -d "$OUT" 'META-INF/*' || true
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$OUT" "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release-signed.aab
