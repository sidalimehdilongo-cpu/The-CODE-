name: Build Android (APK de test + AAB Play Store)

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Identifiant unique de l'application (ex. com.monnom.coderoute)"
        required: true
        default: "com.yourname.coderoute"
      app_label:
        description: "Nom affiché sous l'icône"
        required: true
        default: "Code de la route"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet et vérifier son contenu
        run: |
          ZIP=""
          for z in *.zip; do
            if unzip -l "$z" | grep -q "assets/questions/jp.json"; then ZIP="$z"; fi
          done
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun zip de la racine ne contient la version récente (assets/questions/jp.json)."
            ls -la *.zip
            exit 1
          fi
          echo "Archive utilisée : $ZIP"
          rm -rf assets lib code_route_fr
          unzip -q -o "$ZIP"
          cp -r code_route_fr/. .
          echo "Images : $(ls assets/images | wc -l) (attendu : 87)"
          ls assets/questions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Préparer le projet Android
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_LABEL: ${{ inputs.app_label }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -euo pipefail
          [ -n "${ADMOB_APP_ID:-}" ] || ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"
          export ADMOB_APP_ID
          ORG="${APP_ID%.*}"
          NAME="${APP_ID##*.}"
          echo "Identifiant de l'application : $APP_ID"
          echo "Identifiant AdMob utilisé : $ADMOB_APP_ID"
          TMP="$(mktemp -d)"
          flutter create --org "$ORG" --project-name "$NAME" --platforms=android "$TMP/app" > /dev/null
          rm -rf android
          cp -r "$TMP/app/android" android
          python3 - <<'PY'
          import os, re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          label = os.environ["APP_LABEL"]
          raw = os.environ["ADMOB_APP_ID"]
          admob = re.sub(r"[\s\"']", "", raw)
          if not re.fullmatch(r"ca-app-pub-[0-9]{16}~[0-9]{10}", admob):
              print("ATTENTION : ADMOB_APP_ID invalide (" + repr(raw) + "). ID de test utilise a la place.")
              admob = "ca-app-pub-3940256099942544~3347511713"
          print("ID d'application AdMob ecrit dans le manifeste :", admob)
          s = re.sub(r'android:label="[^"]*"', lambda m: 'android:label="' + label + '"', s, count=1)
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if "permission.AD_ID" not in s:
              s = s.replace("<application", '<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application', 1)
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              m = re.search(r"<application[^>]*>", s)
              meta = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="' + admob + '"/>'
              s = s[:m.end()] + meta + s[m.end():]
          open(p, "w", encoding="utf-8").write(s)
          PY
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$f" || true
          done
          echo "----- Manifeste Android obtenu -----"
          cat android/app/src/main/AndroidManifest.xml

      - name: Desactiver la reduction de code R8 (cause du plantage)
        run: |
          python3 - <<'PY'
          import re, os
          done = False
          for f in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if not os.path.exists(f):
                  continue
              s = open(f, encoding="utf-8").read()
              kts = f.endswith(".kts")
              if kts:
                  ins = '\n            isMinifyEnabled = false\n            isShrinkResources = false\n            proguardFiles("proguard-rules.pro")'
              else:
                  ins = "\n            minifyEnabled false\n            shrinkResources false\n            proguardFiles 'proguard-rules.pro'"
              pat = r'(buildTypes\s*\{.*?(?:getByName\("release"\)|release)\s*\{)'
              s2, n = re.subn(pat, lambda m: m.group(1) + ins, s, count=1, flags=re.S)
              if n:
                  open(f, "w", encoding="utf-8").write(s2)
                  done = True
              print(f, "modifie" if n else "motif introuvable")
              print(s2)
          if not done:
              print("ATTENTION : impossible de desactiver R8 automatiquement")
          PY
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class * extends androidx.room.RoomDatabase { <init>(); }
          -keep class androidx.work.** { *; }
          -keep class androidx.room.** { *; }
          -dontwarn androidx.work.**
          EOF
          printf '\nandroid.enableR8.fullMode=false\n' >> android/gradle.properties

      - name: Dépendances
        run: |
          flutter pub add google_mobile_ads:^9.1.0
          grep -n "google_mobile_ads" pubspec.yaml
          flutter pub get

      - name: Verifier l'identifiant de bloc interstitiel
        run: |
          ID="$(printf '%s' "${ADMOB_INTERSTITIAL_ID:-}" | tr -d '[:space:]"\047')"
          if printf '%s' "$ID" | grep -Eq '^ca-app-pub-[0-9]{16}/[0-9]{10}$'; then
            echo "Bloc interstitiel valide : $ID"
          else
            echo "ATTENTION : ADMOB_INTERSTITIAL_ID absent ou invalide. Bloc de test Google utilise."
            ID=""
          fi
          echo "AD_UNIT=$ID" >> "$GITHUB_ENV"

      - name: APK de test
        run: flutter build apk --release --no-shrink --dart-define=FAKE_PURCHASE=true --dart-define=ADMOB_INTERSTITIAL_ID="$AD_UNIT"

      - name: AAB pour le Play Store
        run: flutter build appbundle --release --dart-define=ADMOB_INTERSTITIAL_ID="$AD_UNIT"

      - name: Préparer le test de lancement
        run: |
          cat > diag.sh <<'EOF'
          adb install -r build/app/outputs/flutter-apk/app-release.apk
          adb logcat -c
          adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
          sleep 25
          adb logcat -d > logcat.txt
          echo "===== L'application tourne-t-elle encore ? ====="
          adb shell pidof "$APP_ID" || echo "NON : l'application s'est fermée."
          echo "===== Plantage (FATAL EXCEPTION) ====="
          grep -n -A 25 "FATAL EXCEPTION" logcat.txt | head -80
          echo "===== Autres signaux de fermeture ====="
          grep -E "has died|Force finishing|Fatal signal|SIGSEGV" logcat.txt | head -20
          echo "===== Messages flutter et publicités ====="
          grep -E "flutter|GoogleMobileAds|MobileAds|Ads" logcat.txt | tail -60
          EOF

      - name: Activer KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tester le lancement de l'APK sur un téléphone virtuel
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APP_ID: ${{ inputs.app_id }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash diag.sh

      - name: Sauvegarder le journal du test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore

      - name: Signer l'AAB avec votre clé d'envoi
        if: env.HAS_KEYSTORE == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          IN=build/app/outputs/bundle/release/app-release.aab
          OUT=build/app/outputs/bundle/release/app-release-signed.aab
          cp "$IN" "$OUT"
          zip -q -d "$OUT" 'META-INF/*' || true
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$OUT" "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release-signed.aab
